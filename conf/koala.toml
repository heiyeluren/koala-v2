# Koala API 测试配置文件

[server]
listen = ":9981"
read_timeout = "5s"
write_timeout = "5s"
shutdown_timeout = "10s"

[rules]
file = "conf/rules.toml"
reload_interval = "0s"

[storage]
type = "local"

[storage.local]
max_size = "64MB"
num_counters = 10000

[logging]
level = "info"
format = "json"
console = true

[logging.file]
enabled = true
path = "logs/koala.log"
max_size = 100        # MB
max_backups = 10      # 保留文件数
max_age = 30          # 保留天数
compress = true       # 是否压缩旧日志

[metrics]
enabled = true
path = "/metrics"
